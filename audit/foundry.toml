# Attack tests for the two lock contracts. Run by .github/workflows/audit.yml
[profile.default]
src = "src"
test = "test"
libs = ["lib", "node_modules"]
allow_paths = ["../source"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 20000

[invariant]
runs = 1000
depth = 60
fail_on_revert = false
