# Safety audit: runs automatically whenever the contracts, the app or these checks change,
# every Monday, and by hand from the Actions tab ("Run workflow").
# 1. Rebuild both locks from source and check they are byte-for-byte the code the app uses.
# 2. Slither (static analysis) on both lock contracts.
# 3. Foundry attack tests: fuzzing and random-sequence (invariant) tests that try to get money out early or to someone else.
# 4. The app's own 49 safety tests, in a headless browser.
name: Safety audit

on:
  push:
    branches: [main]
    paths: ['source/**', 'audit/**', 'tests.html', '.github/workflows/audit.yml']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned tools (OpenZeppelin 4.9.6, solc 0.8.24, forge-std v1.9.4)
        run: |
          npm install --no-audit --no-fund
          git clone --depth 1 --branch v1.9.4 https://github.com/foundry-rs/forge-std lib/forge-std

      - name: 1. Rebuild the locks from source and compare with the app
        run: node scripts/rebuild.js 2>&1 | tee rebuild.txt

      - name: Report rebuild results
        if: always()
        run: scripts/report.sh "Rebuild from source" rebuild.txt

      - uses: foundry-rs/foundry-toolchain@v1

      - name: 3. Foundry attack tests (fuzz + invariants)
        run: |
          cp ../source/GoalTimelock.sol src/GoalTimelock.sol   # exact copy of the contract under test
          forge test 2>&1 | tee forge.txt

      - name: Report Foundry results
        if: always()
        run: scripts/report.sh "Foundry attack tests" forge.txt

      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: '3.12'

      - name: 2. Slither static analysis
        if: always()
        run: |
          pip install --quiet slither-analyzer==0.10.4
          SOLC=$(ls ~/.svm/0.8.24/solc-0.8.24)   # the exact compiler Foundry already downloaded
          NM="$PWD/node_modules"; OUT="$PWD/slither.txt"
          mkdir -p /tmp/sl && cp src/GoalTimelock.sol /tmp/sl/ && cd /tmp/sl   # outside the Foundry project, plain solc mode
          for f in GoalTimelock.sol "$NM/@openzeppelin/contracts/token/ERC20/utils/TokenTimelock.sol"; do
            echo "=== Slither: $(basename "$f")" | tee -a "$OUT"
            slither "$f" --solc "$SOLC" --solc-remaps "@openzeppelin/contracts/=$NM/@openzeppelin/contracts/" --exclude-dependencies --fail-none 2>&1 | tee -a "$OUT"
          done

      - name: Report Slither results
        if: always()
        run: |
          awk '/^=== Slither/{print; next} /Detector-Documentation#/{sub(/.*#/, "  finding: "); print}' slither.txt > slither-summary.txt
          scripts/report.sh "Slither findings by contract" slither-summary.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## Safety audit"
            echo "### 1. Rebuild from source"; echo '```'; cat rebuild.txt 2>/dev/null; echo '```'
            echo "### 2. Slither"; echo '```'; cat slither.txt 2>/dev/null; echo '```'
            echo "### 3. Foundry attack tests"; echo '```'; grep -E "PASS|FAIL|Suite result|runs:|calls:" forge.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Run the 49 safety tests in tests.html
        working-directory: audit
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/run_app_tests.js 2>&1 | tee app-tests.txt
          { echo "## App safety tests"; echo '```'; cat app-tests.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Report app test results
        if: always()
        run: audit/scripts/report.sh "App safety tests" audit/app-tests.txt
