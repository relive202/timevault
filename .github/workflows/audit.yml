# Safety audit: runs automatically whenever the contracts, the app or these checks change,
# every Monday, and by hand from the Actions tab ("Run workflow").
# 1. Rebuild both locks from source and check they are byte-for-byte the code the app uses.
# 2. Slither (static analysis) on both lock contracts.
# 3. Foundry attack tests: fuzzing and random-sequence (invariant) tests that try to get money out early or to someone else.
# 4. The app's own 49 safety tests, in a headless browser.
name: Safety audit

on:
  push:
    branches: [main]
    paths: ['source/**', 'audit/**', 'tests.html', '.github/workflows/audit.yml']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned tools (OpenZeppelin 4.9.6, solc 0.8.24, forge-std v1.9.4)
        run: |
          npm install --no-audit --no-fund
          git clone --depth 1 --branch v1.9.4 https://github.com/foundry-rs/forge-std lib/forge-std

      - name: 1. Rebuild the locks from source and compare with the app
        run: node scripts/rebuild.js | tee rebuild.txt

      - uses: foundry-rs/foundry-toolchain@v1

      - name: 3. Foundry attack tests (fuzz + invariants)
        run: forge test -vv | tee forge.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 2. Slither static analysis
        run: |
          pip install --quiet slither-analyzer==0.10.4 solc-select==1.0.4
          solc-select install 0.8.24 && solc-select use 0.8.24
          R="@openzeppelin/contracts/=$PWD/node_modules/@openzeppelin/contracts/"
          for f in ../source/GoalTimelock.sol node_modules/@openzeppelin/contracts/token/ERC20/utils/TokenTimelock.sol; do
            echo "=== Slither: $f" | tee -a slither.txt
            slither "$f" --solc-remaps "$R" --exclude-dependencies --fail-none 2>&1 | tee -a slither.txt
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## Safety audit"
            echo "### 1. Rebuild from source"; echo '```'; cat rebuild.txt 2>/dev/null; echo '```'
            echo "### 2. Slither"; echo '```'; cat slither.txt 2>/dev/null; echo '```'
            echo "### 3. Foundry attack tests"; echo '```'; grep -E "PASS|FAIL|Suite result|runs:|calls:" forge.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Run the 49 safety tests in tests.html
        working-directory: audit
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/run_app_tests.js | tee app-tests.txt
          { echo "## App safety tests"; echo '```'; cat app-tests.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
